name: conveyor-deploy.yml


on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:


  deploy:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'graalvm-community'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: printConveyorConfig
        run: ./gradlew :composeApp:printConveyorConfig
      - name: Build Desktop
        run: ./gradlew :composeApp:proguardReleaseJars
      - name: writeConveyorConfig
        run: ./gradlew :composeApp:writeConveyorConfig   # 按你的模块调整
      # 核心：运行 Conveyor Action
      - name: Run Conveyor
        uses: hydraulic-software/conveyor/actions/build@v22.2   # 请使用最新版本
        with:
          command: make copied-site          # 或 make site
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1
          # 可选额外参数
          # extra_flags: -Kapp.site.copy-to="${{ secrets.COPY_TO }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 上传到 GitHub Releases 需要
          # APPLE_ASP: ${{ secrets.APPLE_ASP }}      # 如果需要 Apple 公证