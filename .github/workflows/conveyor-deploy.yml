name: conveyor-deploy.yml


on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*
    branches: ['**']

jobs:


  deploy:

    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'graalvm-community'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: printConveyorConfig
        run: ./gradlew :composeApp:printConveyorConfig
      - name: Build Desktop
        run: ./gradlew :composeApp:proguardReleaseJars
      - name: writeConveyorConfig
        run: ./gradlew :composeApp:writeConveyorConfig   # 按你的模块调整
      # 核心：运行 Conveyor Action
      - name: Run Conveyor
        uses: hydraulic-software/conveyor/actions/build@v22.2   # 请使用最新版本
        env:
          TV_TOKEN_FOR_GITHUB: ${{ secrets.GITHUB_TOKEN  }}   # 上传到 GitHub Releases 需要
          # APPLE_ASP: ${{ secrets.APPLE_ASP }}      # 如果需要 Apple 公证
        with:
          command: make copied-site          # 或 make site
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1
          # 可选额外参数
          # extra_flags: -Kapp.site.copy-to="${{ secrets.COPY_TO }}"
      - name: Diagnose on failure
        if: failure()
        run: |
          echo "❌ Conveyor 任务失败。常见原因:"
          echo "1. GITHUB_TOKEN 权限不足（需要 contents:write + pages:write）"
          echo "2. copy-to 指向的仓库不存在或当前用户无权写入"
          echo "3. SIGNING_KEY 未配置"
          echo ""
          echo "当前 copy-to 目标: github:lushunming/TV-Multiplatform"
          echo "请检查该仓库的 Settings → Actions → Workflow permissions 是否为 'Read and write permissions'"
