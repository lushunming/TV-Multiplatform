name: TV-Multiplatform Build (AppCdsPrebuild)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  set-tag:
    uses: ./.github/workflows/set-tag-workflow.yml

  # ==================== Windows ====================
  build-win:
    runs-on: windows-latest
    needs: set-tag
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission
        shell: bash
        run: chmod +x ./gradlew

      - name: Build Windows distributable (AppCdsPrebuild)
        run: |
          ./gradlew createReleaseDistributable --info
          ./gradlew packageReleaseDistributionForCurrentOS --info

      - name: Verify AppCDS archive (.jsa) exists
        shell: pwsh
        run: |
          $jsa = Get-ChildItem -Path .\composeApp\build\compose\binaries -Recurse -Filter *.jsa -ErrorAction SilentlyContinue
          if (-not $jsa) {
            Write-Error "❌ 未找到 .jsa 文件，AppCdsPrebuild 可能失败"
            exit 1
          }
          Write-Host "✅ 找到 AppCDS 归档:"
          $jsa | ForEach-Object { Write-Host $_.FullName }

      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse .\composeApp\build\compose\binaries | Select-Object FullName

      - name: Compress app directory
        shell: pwsh
        run: |
          $tag = "${{ needs.set-tag.outputs.tag }}"
          Compress-Archive -Path "./composeApp/build/compose/binaries/main-release/app/TVMultiplatform" `
                           -DestinationPath "./TV-win-$tag.zip" -Force

      - name: Move installers to root
        shell: pwsh
        run: |
          Move-Item -Path "./composeApp/build/compose/binaries/main-release/msi/*.msi" -Destination "./" -Force -ErrorAction SilentlyContinue
          Move-Item -Path "./composeApp/build/compose/binaries/main-release/app/*.zip" -Destination "./" -Force -ErrorAction SilentlyContinue
         

      - uses: actions/upload-artifact@v4
        with:
          name: win-file
          path: |
            *.msi
            *.zip
          if-no-files-found: error

  # ==================== Linux ====================
  build-linux:
    runs-on: ubuntu-latest
    needs: set-tag
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '25'
          cache: 'gradle'

      - name: Install CI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libx11-dev libxext-dev libxrender-dev libxtst-dev libxi-dev \
            libgl1-mesa-glx libglu1-mesa \
            libasound2 libpulse0 \
            ffmpeg

      - name: Build Linux (AppCdsPrebuild)
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2

          # 单次训练最多 3 分钟，避免无限挂起
           ./gradlew createReleaseDistributable --info || true
           ./gradlew packageReleaseDistributionForCurrentOS --info
        env:
          GITHUB_ACTIONS: true

      - name: Verify AppCDS archive (.jsa) exists
        run: |
          echo "查找 .jsa 文件..."
          find composeApp/build/compose/binaries -name "*.jsa" -print
          if ! find composeApp/build/compose/binaries -name "*.jsa" | grep -q .; then
            echo "❌ 未找到 .jsa 文件，AppCdsPrebuild 可能失败"
            exit 1
          fi
          echo "✅ 找到 AppCDS 归档"

      - name: List output
        run: |
          ls -la
          find ./composeApp/build/compose/binaries -type f | head -80

      - name: Compress app directory
        run: |
          TAG="${{ needs.set-tag.outputs.tag }}"
          cd ./composeApp/build/compose/binaries/main-release/app
          zip -q -r "../../../../../../TV-linux-${TAG}.zip" ./TVMultiplatform
          cd -

      - name: Move packages to root
        run: |
          TAG="${{ needs.set-tag.outputs.tag }}"
          mv ./composeApp/build/compose/binaries/main-release/deb/*.deb "./TV-linux-${TAG}.deb" || true
          mv ./composeApp/build/compose/binaries/main-release/app/*.zip ./ || true
          ls -la *.deb *.zip 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-file
          path: |
            *.deb
            *.zip
          if-no-files-found: error

  # ==================== macOS ====================
  build-mac:
    runs-on: macos-15-intel
    needs: set-tag
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build macOS distributable (AppCdsPrebuild)
        run: |
          ./gradlew createReleaseDistributable --info
          ./gradlew packageReleaseDistributionForCurrentOS --info

      - name: Verify AppCDS archive (.jsa) exists
        run: |
          echo "查找 .jsa 文件..."
          find composeApp/build/compose/binaries -name "*.jsa" -print
          if ! find composeApp/build/compose/binaries -name "*.jsa" | grep -q .; then
            echo "❌ 未找到 .jsa 文件，AppCdsPrebuild 可能失败"
            exit 1
          fi
          echo "✅ 找到 AppCDS 归档"

      - name: List output
        run: |
          ls -la
          find ./composeApp/build/compose/binaries -type f | head -80

      - name: Compress app directory
        run: |
          TAG="${{ needs.set-tag.outputs.tag }}"
          zip -q -r "./TV-mac-${TAG}.zip" ./composeApp/build/compose/binaries/main-release/app

      - name: Move DMG to root
        run: |
          TAG="${{ needs.set-tag.outputs.tag }}"
          mv ./composeApp/build/compose/binaries/main-release/dmg/*.dmg "./TV-mac-${TAG}.dmg" || true
          ls -la *.dmg *.zip 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: mac-file
          path: |
            *.dmg
            *.zip
          if-no-files-found: error

  # ==================== Release ====================
  release:
    runs-on: ubuntu-latest
    needs: [build-win, build-linux, build-mac, set-tag]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Show downloaded files
        run: |
          ls -la
          find . -type f \( -name "*.zip" -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set-tag.outputs.tag }}
          name: Release ${{ needs.set-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            **/*.zip
            **/*.deb
            **/*.dmg
            **/*.msi
            **/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}