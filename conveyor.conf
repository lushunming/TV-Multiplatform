// This is a hashbang include. You can run the command after the #! to see what
// configuration is being extracted from the Gradle build using the Conveyor plugin.
include "#!./gradlew -q composeApp:printConveyorConfig"
// include "#!../gradlew -q printConveyorConfig"
// include required("desktop/generated.conveyor.conf")
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

// This enables native library extraction, which improves app startup time and robustness.
// It's optional but a good idea to have it. You can remove this if you get tired of specifying
// system properties for Java libraries with native components.
//
// See https://hydraulic.software/blog/11-in-jar-signing.html for more.
//include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

// Config file documentation: https://conveyor.hydraulic.dev/latest/configs
app {
  icons = "./composeApp/src/commonMain/resources/icon.svg"

  windows.inputs += TASK/rendered-icons/windows
  linux.inputs += TASK/rendered-icons/linux
  compression-level = high
  license = "GPL-3.0"

  vcs-url = "https://github.com/lushunming/TV-Multiplatform"
  site {
          // 使用加速代理（国内推荐）
          base-url = "https://gh-proxy.com/https://github.com/lushunming/TV-Multiplatform/releases/latest/download"

          github {
              oauth-token = ${env.GITHUB_TOKEN}
              pages-branch = "gh-pages"   // 可选：同时发布 download.html
          }
      }

      updates = background   // 或 aggressive

  machines = ["windows.amd64", "mac.amd64", "mac.aarch64", "linux.amd64.glibc", "linux.aarch64.glibc"]
    # Import all the obfuscated JARs, except the JAR that contains the platform native graphics code.
  inputs = [{
      from = composeApp/build/compose/tmp/main-release/proguard
      remap = [
          "**"
          "-skiko-awt-runtime-*.jar"
      ]
    }]
    // 再按平台覆盖/追加正确的 Skiko 运行时
      linux.amd64.inputs = ${app.inputs} [
        ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-linux-x64/0.9.37.3/*/skiko-awt-runtime-linux-x64-0.9.37.3.jar
      ]

      mac.aarch64.inputs = ${app.inputs} [
        ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-macos-arm64/0.9.37.3/*/skiko-awt-runtime-macos-arm64-0.9.37.3.jar
      ]

      mac.amd64.inputs = ${app.inputs} [
        ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-macos-x64/0.9.37.3/*/skiko-awt-runtime-macos-x64-0.9.37.3.jar
      ]

      windows.amd64.inputs = ${app.inputs} [
        ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-windows-x64/0.9.37.3/*/skiko-awt-runtime-windows-x64-0.9.37.3.jar
      ]
     # Put the dropped JAR back with the right version for each platform.
     #   linux.amd64.inputs = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-linux-x64/0.9.37.3/aa9d80683c4b8fd560e22eb53a70b335e8281b66/skiko-awt-runtime-linux-x64-0.9.37.3.jar ]
     #   mac.aarch64.inputs = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-macos-arm64/0.9.37/3f7fe53a3c9c0c96dbe07c22ba4a38234ff13487/skiko-awt-runtime-macos-arm64-0.7.34.jar ]
     #   mac.amd64.inputs = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-macos-x64/0.9.37/466356827dcdb20c4202fa280ff95c41b215313/skiko-awt-runtime-macos-x64-0.7.34.jar ]
     #   windows.amd64.inputs = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-windows-x64/0.9.37/2f9bb0ad1dd10255bea3b0099940b7163bf40da7/skiko-awt-runtime-windows-x64-0.9.37.3.jar ]
  jvm {
    modules = [
       "java.management",
                       "java.net.http",
                       "jdk.unsupported",
                       "java.naming",
                       "java.base",
                       "java.sql"
    ]

    system-properties {
      dwmapi.nativeLibraryPath = system
      skiko.nativeLibraryPath = system
      skiko-windows.nativeLibraryPath = system
    }

    extract-native-libraries = true
  }

  windows.console = false

  site {
    consistency-checks = warn
  }
}

conveyor.compatibility-level = 22